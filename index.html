<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;text-align:center;padding:32px 20px;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  h2{font-size:22px;color:#111;margin-bottom:4px}
  .vpa{font-size:13px;color:#555;word-break:break-all;margin-bottom:20px}
  a.btn{display:block;width:100%;padding:14px;border-radius:10px;text-decoration:none;font-size:17px;font-weight:600;color:#fff;margin-bottom:10px;transition:opacity .15s}
  a.btn:active{opacity:.8}
  .btn-auto {background:#1a73e8}
  .fallback{margin-top:8px;font-size:13px;color:#888}
  .fallback code{font-size:12px;word-break:break-all;color:#333;display:block;margin-top:4px;background:#eee;padding:6px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="card">
  <h2 id="amt">Loading...</h2>
  <p class="vpa" id="vpa"></p>
  <a class="btn btn-auto" id="open" href="#">Open App</a>
  <p class="fallback">App nahi khula? UPI ID copy karo:<br><code id="vpa2"></code></p>
</div>

<script>
const p   = new URLSearchParams(location.search);
const app = (p.get("app") || "upi").toLowerCase();
const pa  = p.get("pa")  || "";
const pn  = p.get("pn")  || "";
const am  = p.get("am")  || "";
const tn  = p.get("tn")  || "";
const cu  = "INR";

document.getElementById("amt").textContent  = "Pay ₹" + am;
document.getElementById("vpa").textContent  = "UPI ID: " + pa;
document.getElementById("vpa2").textContent = pa;

// Standard UPI query string
const upiQs = new URLSearchParams({ pa, pn, am, cu, tn }).toString();

// App-specific link builders
// Paytm & MobiKwik have their own schemes; others use intent:// with upi scheme
const buildLink = () => {
  const isAndroid = /android/i.test(navigator.userAgent);

  switch (app) {
    case "paytm":
      // Paytm uses its own paytmmp:// scheme
      return isAndroid
        ? `paytmmp://pay?${upiQs}`
        : `paytm://upi/pay?${upiQs}`;

    case "mobikwik":
      // MobiKwik uses mobikwik:// scheme
      return `mobikwik://send?${upiQs}`;

    case "phonepe":
      return isAndroid
        ? `intent://pay?${upiQs}#Intent;scheme=upi;package=com.phonepe.app;end`
        : `phonepe://pay?${upiQs}`;

    case "gpay":
      return isAndroid
        ? `intent://pay?${upiQs}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`
        : `tez://upi/pay?${upiQs}`;

    case "bhim":
      return isAndroid
        ? `intent://pay?${upiQs}#Intent;scheme=upi;package=in.org.npci.upiapp;end`
        : `upi://pay?${upiQs}`;

    default:
      // Generic — works for most NPCI-compliant apps
      return isAndroid
        ? `intent://pay?${upiQs}#Intent;scheme=upi;S.browser_fallback_url=https%3A%2F%2Fpay.google.com;end`
        : `upi://pay?${upiQs}`;
  }
};

const link = buildLink();
document.getElementById("open").href = link;

// Auto-redirect after short delay
setTimeout(() => { try { location.href = link; } catch(e){} }, 350);
</script>
</body>
</html>

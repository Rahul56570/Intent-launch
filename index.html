<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting...</title>
</head>
<body>
<script>
const p  = new URLSearchParams(location.search);
const pa = p.get("pa") || "";
const pn = p.get("pn") || "";
const am = p.get("am") || "";
const tn = p.get("tn") || "";
const qs = new URLSearchParams({pa, pn, am, cu:"INR", tn}).toString();

// intent:// opens Android UPI app chooser directly — no Play Store fallback
const url = "intent://pay?" + qs + "#Intent;scheme=upi;end";
location.replace(url);
</script>
</body>
</html>

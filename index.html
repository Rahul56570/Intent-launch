<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay</title>
<style>
  body{font-family:sans-serif;text-align:center;padding:40px 20px}
  a.btn{display:inline-block;margin-top:16px;padding:14px 28px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-size:18px}
</style>
</head>
<body>
<h2 id="amt">Opening UPI app...</h2>
<a class="btn" id="open" href="#">Open App</a>
<p id="vpa"></p>

<script>
const p = new URLSearchParams(location.search);
const app = p.get("app") || "upi";

const pkgs = {
  gpay:     "com.google.android.apps.nbu.paisa.user",
  phonepe:  "com.phonepe.app",
  paytm:    "net.one97.paytm",
  bhim:     "in.org.npci.upiapp",
  mobikwik: "com.mobikwik_new",
};

const qs = new URLSearchParams({
  pa: p.get("pa"), pn: p.get("pn") || "",
  am: p.get("am"), cu: "INR", tn: p.get("tn") || ""
}).toString();

const isAndroid = /android/i.test(navigator.userAgent);
const link = (isAndroid && pkgs[app])
  ? `intent://pay?${qs}#Intent;scheme=upi;package=${pkgs[app]};end`
  : `upi://pay?${qs}`;

document.getElementById("amt").textContent = "Pay ₹" + p.get("am");
document.getElementById("vpa").textContent = "UPI ID: " + p.get("pa");
document.getElementById("open").href = link;
setTimeout(() => location.href = link, 400);
</script>
</body>
</html>
